name: Check static site and optionally deploy Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check HTML and local links
        run: python3 scripts/check_site.py
      - name: Prepare public files
        run: python3 scripts/build_site.py
      - name: Upload website for deployment
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: vars.ENABLE_PAGES == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
